# pg_hba.conf for the goopg instance backing WordPress.
#
# goopg's built-in default policy only trusts loopback, but the WordPress
# container connects from the Docker bridge subnet (via host.docker.internal).
# goopg v0 only enforces `trust`/`reject`, so we trust all hosts here. This is
# a local development setup; do not expose port 5544 to untrusted networks.
#
# TYPE  DATABASE  USER  ADDRESS       METHOD
local   all       all                 trust
host    all       all   127.0.0.1/32  trust
host    all       all   ::1/128       trust
host    all       all   0.0.0.0/0     trust
host    all       all   ::/0          trust
